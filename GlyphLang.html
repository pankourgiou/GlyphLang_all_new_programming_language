<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>GlyphLang</title>
<style>
:root{--bg:#0f1117;--surface:#181b24;--border:#2a2e3b;--text:#e2e4ea;--muted:#8b92a8;--accent:#7678e3;--accent2:#5e60c7;--err:#e06c75;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.6;padding:2rem;max-width:1100px;margin:auto}
h1{margin:0 0 .25rem;font-size:1.9rem}.sub{color:var(--muted);margin:0 0 1.5rem}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1.25rem}
.row{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
button,select{background:var(--accent);border:none;color:#fff;padding:.5rem 1rem;border-radius:8px;cursor:pointer;font-size:.95rem}
button:hover{background:var(--accent2)}select{background:var(--surface);border:1px solid var(--border);color:var(--text)}
textarea,input[type=text]{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:monospace;font-size:1.05rem;padding:.75rem}
textarea{min-height:140px;resize:vertical}
.output{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.75rem;font-family:monospace;min-height:60px;white-space:pre-wrap}
.output.err{color:var(--err)}table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:.45rem .6rem;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:500}.g{font-size:1.25rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body>

<h1>GlyphLang Playground</h1><p class="sub">A stack-based esolang using exotic Unicode glyphs. 100% offline.</p>

<div class="panel"><div class="row">
<label style="color:var(--muted)">Example:</label>
<select id="picker" onchange="loadExample()">
<option value="hi">Hi</option><option value="abc">abc</option><option value="hello">Hello</option>
<option value="glyph">Glyph</option><option value="counter">Counter 0-2</option>
<option value="math">Math: 3+4x2=11</option><option value="double">Double 5</option>
<option value="square">Square 4</option></select></div>
<textarea id="editor" spellcheck="false"></textarea>
<div class="row" style="margin-top:1rem">
<button onclick="runCode()">Run Program</button>
<button onclick="downloadCode()" style="background:var(--surface);border:1px solid var(--border)">Download .glyphlang</button>
</div><div style="margin-top:1rem">
<strong style="color:var(--muted);font-size:.8rem;letter-spacing:.05em">OUTPUT</strong>
<div id="out" class="output" style="margin-top:.5rem">(click Run)</div></div></div>

<div class="panel grid"><div>
<strong style="color:var(--muted);font-size:.8rem;letter-spacing:.05em">TEXT TO GLYPH ENCODER</strong>
<p class="sub" style="margin:.5rem 0 1rem">Type normal text, get the GlyphLang code.</p>
<input type="text" id="plain" placeholder="Type abc..." oninput="encodeText()">
<div id="encoded" class="output" style="margin-top:.5rem"></div></div><div>
<strong style="color:var(--muted);font-size:.8rem;letter-spacing:.05em">NUMBER TO GLYPHS</strong>
<p class="sub" style="margin:.5rem 0 1rem">Type a number, get glyph digits.</p>
<input type="text" id="numIn" placeholder="Type 105..." oninput="encodeNumber()">
<div id="numOut" class="output" style="margin-top:.5rem"></div></div></div>

<div class="panel"><strong style="color:var(--muted);font-size:.8rem;letter-spacing:.05em">GLYPH REFERENCE</strong>
<table style="margin-top:.75rem"><thead><tr><th>Category</th><th>Glyph</th><th>Name</th><th>What it does</th></tr></thead><tbody id="ref"></tbody></table></div>

<script>const DIGITS=['⦿','⊙','⊚','⊛','⊜','⊝','⟴','⟲','⟳','⥁'];const CMDS={'⨁':'add','⨂':'sub','⨀':'mul','⩗':'div','⧆':'mod','⧈':'dup','⧉':'swap','⧊':'drop','⧋':'over','⧌':'rot','⦗':'pnum','⦘':'pchr','⦙':'inum','⦚':'ichr','⧁':'lbl','⧂':'jmp','⧃':'jz','⧄':'jnz','⧅':'halt','⧍':'sto','⧎':'lod','⧏':'eq','⧐':'gt','⧑':'lt','⧒':'not','⧓':'and','⧔':'or'};const EXAMPLES={hi:`⟲⊚ ⦘ ⊙⦿⊝ ⦘`,abc:`⥁⟲ ⦘ ⥁⟳ ⦘ ⥁⥁ ⦘`,hello:`⟲⊚ ⦘ ⊙⦿⊙ ⦘ ⊙⦿⟳ ⦘ ⊙⦿⟳ ⦘ ⊙⊙⊙ ⦘`,glyph:`⟲⊙ ⦘ ⊙⦿⟳ ⦘ ⊙⊚⊙ ⦘ ⊙⊙⊚ ⦘ ⊙⦿⊜ ⦘`,counter:`⦿
⧁ loop
  ⧈ ⦗
  ⊙ ⨁
  ⧈
  ⊛
  ⧑
  ⧄ loop
⧅`,math:`⊛ ⊜ ⊚ ⨀ ⨁ ⦗`,double:`⊝ ⧈ ⨁ ⦗`,square:`⊜ ⧈ ⨀ ⦗`};
function loadExample(){document.getElementById('editor').value=EXAMPLES[document.getElementById('picker').value];}
loadExample();
function toGlyphNum(n){return String(n).split('').map(d=>DIGITS[parseInt(d,10)]).join('');}
function encodeText(){var t=document.getElementById('plain').value;if(!t){document.getElementById('encoded').textContent='';return;}var out=[...t].map(function(ch){return toGlyphNum(ch.codePointAt(0))+' '+DIGITS[1];}).join(' ');document.getElementById('encoded').textContent=out;}
function encodeNumber(){var t=document.getElementById('numIn').value.replace(/\D/g,'');if(!t){document.getElementById('numOut').textContent='';return;}document.getElementById('numOut').textContent=toGlyphNum(parseInt(t,10));}

function GL(src){this.tok=src.split(/\s+/).filter(Boolean);this.stk=[];this.vars={};this.ip=0;this.out=[];this.lbls={};for(var i=0;i<this.tok.length;i++){if(this.tok[i]==='⧁'&&i+1<this.tok.length){this.lbls[this.tok[i+1]]=i+2;i++;}}}
GL.prototype.parseNum=function(tok){var v=0;for(var i=0;i<tok.length;i++){var d=DIGITS.indexOf(tok[i]);if(d<0)return null;v=v*10+d;}return v;};
GL.prototype.pop=function(){if(!this.stk.length)throw new Error('Stack underflow');return this.stk.pop();};
GL.prototype.peek=function(n){n=n||1;if(this.stk.length<n)throw new Error('Stack underflow');return this.stk[this.stk.length-n];};
GL.prototype.push=function(v){this.stk.push(v);};
GL.prototype.run=function(){while(this.ip<this.tok.length){var t=this.tok[this.ip];var n=this.parseNum(t);if(n!==null){this.push(n);this.ip++;continue;}var op=CMDS[t];if(!op)throw new Error('Unknown glyph "'+t+'" at token '+this.ip);if(op==='lbl'){this.ip+=2;}else if(op==='jmp'){this.ip=this.lbls[this.tok[this.ip+1]];}else if(op==='jz'){var a=this.lbls[this.tok[this.ip+1]];this.ip+=2;this.ip=(this.pop()===0)?a:this.ip;}else if(op==='jnz'){var a=this.lbls[this.tok[this.ip+1]];this.ip+=2;this.ip=(this.pop()!==0)?a:this.ip;}else if(op==='sto'){this.vars[this.tok[this.ip+1]]=this.pop();this.ip+=2;}else if(op==='lod'){this.push(this.vars[this.tok[this.ip+1]]||0);this.ip+=2;}else{this.ip++;switch(op){case'add':{var b=this.pop(),a=this.pop();this.push(a+b);}break;case'sub':{var b=this.pop(),a=this.pop();this.push(a-b);}break;case'mul':{var b=this.pop(),a=this.pop();this.push(a*b);}break;case'div':{var b=this.pop(),a=this.pop();this.push(Math.floor(a/b));}break;case'mod':{var b=this.pop(),a=this.pop();this.push(a%b);}break;case'dup':this.push(this.peek(1));break;case'swap':{var a=this.pop(),b=this.pop();this.push(a);this.push(b);}break;case'drop':this.pop();break;case'over':this.push(this.peek(2));break;case'rot':{var c=this.pop(),b=this.pop(),a=this.pop();this.push(b);this.push(c);this.push(a);}break;case'pnum':this.out.push(String(this.pop()));break;case'pchr':this.out.push(String.fromCodePoint(this.pop()));break;case'inum':this.push(parseInt((prompt('≻ Number:')||'0'),10));break;case'ichr':this.push((prompt('≻ Char:')||' ').codePointAt(0));break;case'eq':{var b=this.pop(),a=this.pop();this.push(a===b?1:0);}break;case'gt':{var b=this.pop(),a=this.pop();this.push(a>b?1:0);}break;case'lt':{var b=this.pop(),a=this.pop();this.push(a<b?1:0);}break;case'not':this.push(this.pop()===0?1:0);break;case'and':{var b=this.pop(),a=this.pop();this.push(a&&b?1:0);}break;case'or':{var b=this.pop(),a=this.pop();this.push(a||b?1:0);}break;}}if(op==='halt')break;}return this.out.join('');};

function runCode(){var src=document.getElementById('editor').value;var el=document.getElementById('out');try{var r=new GL(src).run();el.className='output';el.textContent=r||'(no output)';}catch(e){el.className='output err';el.textContent='Error: '+e.message;}}
function downloadCode(){var b=new Blob([document.getElementById('editor').value],{type:'text/plain;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='program.glyphlang';a.click();}

var ROWS=[
{g:"⦿ ⊙ ⊚ ⊛ ⊜ ⊝ ⟴ ⟲ ⟳ ⥁",c:"Digits",n:"Zero - Nine",e:"Push that digit. Chain to build numbers (e.g. ⟲⊚ = 72)"},
{g:"⨁",c:"Arithmetic",n:"Add",e:"Pop b, pop a, push a+b"},
{g:"⨂",c:"Arithmetic",n:"Sub",e:"Pop b, pop a, push a-b"},
{g:"⨀",c:"Arithmetic",n:"Mul",e:"Pop b, pop a, push axb"},
{g:"⩗",c:"Arithmetic",n:"Div",e:"Pop b, pop a, push a//b"},
{g:"⧆",c:"Arithmetic",n:"Mod",e:"Pop b, pop a, push a%b"},
{g:"⧈",c:"Stack",n:"Dup",e:"Copy top of stack"},
{g:"⧉",c:"Stack",n:"Swap",e:"Swap top two items"},
{g:"⧊",c:"Stack",n:"Drop",e:"Remove top item"},
{g:"⧋",c:"Stack",n:"Over",e:"Copy second item to top"},
{g:"⧌",c:"Stack",n:"Rot",e:"Rotate top three items"},
{g:"⦗",c:"I/O",n:"Print Num",e:"Pop and print as integer"},
{g:"⦘",c:"I/O",n:"Print Char",e:"Pop and print as Unicode char"},
{g:"⦙",c:"I/O",n:"Input Num",e:"Read integer from user"},
{g:"⦚",c:"I/O",n:"Input Char",e:"Read character from user"},
{g:"⧁ name",c:"Control",n:"Label",e:"Declare a label"},
{g:"⧂ name",c:"Control",n:"Jump",e:"Unconditional jump"},
{g:"⧃ name",c:"Control",n:"JumpZ",e:"Jump if top is 0"},
{g:"⧄ name",c:"Control",n:"JumpNZ",e:"Jump if top is not 0"},
{g:"⧅",c:"Control",n:"Halt",e:"Stop execution"},
{g:"⧍ name",c:"Memory",n:"Store",e:"Pop to variable"},
{g:"⧎ name",c:"Memory",n:"Load",e:"Push variable value"},
{g:"⧏",c:"Logic",n:"Equal",e:"Push 1 if a==b"},
{g:"⧐",c:"Logic",n:"Greater",e:"Push 1 if a>b"},
{g:"⧑",c:"Logic",n:"Less",e:"Push 1 if a<b"},
{g:"⧒",c:"Logic",n:"Not",e:"Push 1 if top==0"},
{g:"⧓",c:"Logic",n:"And",e:"Push 1 if both non-zero"},
{g:"⧔",c:"Logic",n:"Or",e:"Push 1 if either non-zero"}
];

var tb=document.getElementById('ref');
for(var i=0;i<ROWS.length;i++){
  var r=ROWS[i];
  var tr=document.createElement('tr');
  tr.innerHTML='<td>'+r.c+'</td><td class="g">'+r.g+'</td><td>'+r.n+'</td><td>'+r.e+'</td>';
  tb.appendChild(tr);
}
</script></body></html>
